name: Repair FeatureModule relation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'Repair FeatureModule relation') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove invalid FeatureModule relation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('prisma/schema.prisma')
          text = path.read_text()
          start = text.find('model FeatureModule {')
          end = text.find('\n}', start)
          block = text[start:end]
          updated_block = block.replace('  tenantFeatures TenantFeature[]\n', '')
          if updated_block == block:
              print('FeatureModule relation already repaired.')
          else:
              path.write_text(text[:start] + updated_block + text[end:])
              print('Removed invalid FeatureModule.tenantFeatures relation.')
          PY
      - name: Commit repair
        run: |
          if git diff --quiet -- prisma/schema.prisma; then
            echo "No schema changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git commit -m "Repair FeatureModule relation"
          git push
