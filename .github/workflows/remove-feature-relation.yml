name: Remove invalid feature relation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'Remove invalid feature relation') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove relation line
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('prisma/schema.prisma')
          text = path.read_text()
          old = '  tenantFeatures TenantFeature[]\n'
          if old not in text:
              raise SystemExit('Expected invalid FeatureModule relation was not found.')
          path.write_text(text.replace(old, '', 1))
          print('Removed invalid FeatureModule.tenantFeatures relation.')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git commit -m "Remove invalid feature relation"
          git push
