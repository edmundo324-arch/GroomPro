name: GroomPro CI
on:
  push:
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        runtime: [production, preview]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration-only
          MYSQL_DATABASE: groompro_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pintegration-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:integration-only@127.0.0.1:3306/groompro_test
      TEST_DATABASE_URL: mysql://root:integration-only@127.0.0.1:3306/groompro_test
      NEXT_TELEMETRY_DISABLED: '1'
      TEST_RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
      - name: Upload verified GoDaddy schema bundle
        uses: actions/upload-artifact@v4
        with:
          name: godaddy-groompro-schema-${{ matrix.runtime }}
          path: |
            godaddy-groompro-schema.sql
            godaddy-groompro-schema.json
          if-no-files-found: error
