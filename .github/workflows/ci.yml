name: GroomPro CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: mysql://groompro:password@localhost:3306/groompro

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: mysql://groompro:password@localhost:3306/groompro
