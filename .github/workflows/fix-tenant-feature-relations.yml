name: Fix tenant feature relations

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'Fix tenant feature relations') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair relation ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('prisma/schema.prisma')
          text = path.read_text()
          def model_block(name):
              m = re.search(rf'model {name} \{{(.*?)\n\}}', text, re.S)
              if not m:
                  raise SystemExit(f'Model {name} not found')
              return m.group(0), m.start(), m.end()
          # TenantFeature belongs to Tenant; Tenant must expose the opposite relation.
          tenant_block, s, e = model_block('Tenant')
          if '  tenantFeatures TenantFeature[]\n' not in tenant_block:
              tenant_block = tenant_block[:-2] + '  tenantFeatures TenantFeature[]\n}'
              text = text[:s] + tenant_block + text[e:]
          # FeatureModule is keyed by featureCode, not a Prisma FK relation; remove the invalid field.
          feature_block, s, e = model_block('FeatureModule')
          feature_block = feature_block.replace('  tenantFeatures TenantFeature[]\n', '')
          text = text[:s] + feature_block + text[e:]
          path.write_text(text)
          print('TenantFeature now has a valid Tenant opposite relation; FeatureModule relation removed.')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git commit -m "Fix tenant feature relations"
          git push
