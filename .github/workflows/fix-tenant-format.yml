name: Fix tenant feature formatting

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'Fix tenant feature formatting') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair formatting
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('prisma/schema.prisma')
          text = path.read_text()
          bad = '@@index([name])  tenantFeatures TenantFeature[]'
          good = '@@index([name])\n  tenantFeatures TenantFeature[]'
          if bad not in text:
              raise SystemExit('Expected malformed Tenant relation line was not found.')
          path.write_text(text.replace(bad, good, 1))
          print('Repaired Tenant relation formatting.')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git commit -m "Fix tenant feature formatting"
          git push
