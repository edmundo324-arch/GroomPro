name: Normalize Prisma schema enums

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, 'Normalize Prisma enums') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize one-line enums
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('prisma/schema.prisma')
          text = path.read_text()
          pattern = re.compile(r'^enum (\w+) \{ ([^\n{}]+) \}$', re.M)
          def expand(match):
              name, values = match.group(1), match.group(2).split()
              return 'enum ' + name + ' {\n' + ''.join('  ' + value + '\n' for value in values) + '}'
          updated, count = pattern.subn(expand, text)
          if count:
              path.write_text(updated)
              print(f'Normalized {count} enum declarations.')
          else:
              print('Schema already normalized.')
          PY

      - name: Commit normalization
        run: |
          if git diff --quiet -- prisma/schema.prisma; then
            echo "No schema changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git commit -m "Normalize Prisma enums"
          git push
